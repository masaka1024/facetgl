[package]
name = "facetgl"
version = "0.1.0"
description = "FacetGL - a desktop 3D model viewer for glTF / GLB / VRM / PMX / FBX / OBJ / STL"
authors = ["masaka1024"]
license = "MIT"
repository = "https://github.com/masaka1024/facetgl"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
