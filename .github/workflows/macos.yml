# Builds the macOS app (Universal: Apple Silicon + Intel) as a .dmg.
#
# - Pull request: builds to check that the macOS app still compiles; the .dmg is attached to the run.
# - Manual run ("Run workflow" on the Actions tab): the .dmg is attached to the run as an artifact.
# - Push a tag like "v0.2.0": the .dmg is also added to a draft GitHub Release for that tag.
name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Universal .dmg
        run: npm run tauri build -- --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: FacetGL-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Add to draft release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
